extensions:
  health_check:
    endpoint: ${env:PORTHOLE_COLLECTOR_HEALTH_LISTEN}
receivers:
  otlp:
    protocols:
      http:
        endpoint: ${env:PORTHOLE_COLLECTOR_LISTEN}
connectors:
  forward/tail: {}
processors:
  batch/retained:
    timeout: 200ms
    send_batch_size: 100
    send_batch_max_size: 100
  tail_sampling:
    decision_wait: 2s
    num_traces: 20000
    expected_new_traces_per_sec: 1000
    decision_cache:
      sampled_cache_size: 20000
      non_sampled_cache_size: 20000
    policies:
      - name: protected-errors
        type: status_code
        status_code:
          status_codes: [ERROR]
      - name: protected-slow
        type: latency
        latency:
          threshold_ms: 150
      - name: ordinary-ten-percent
        type: probabilistic
        probabilistic:
          sampling_percentage: 10
exporters:
  otlphttp/pre-sampling:
    traces_endpoint: ${env:PORTHOLE_COLLECTOR_DESTINATION}/api/porthole/v1/ingest/pre-sampling/traces
    headers:
      Authorization: ${env:PORTHOLE_COLLECTOR_AUTHORIZATION}
    encoding: json
    compression: none
    sending_queue:
      enabled: false
  otlphttp/retained:
    traces_endpoint: ${env:PORTHOLE_COLLECTOR_DESTINATION}/v1/traces
    headers:
      Authorization: ${env:PORTHOLE_COLLECTOR_AUTHORIZATION}
    encoding: json
    compression: none
    sending_queue:
      enabled: false
service:
  extensions: [health_check]
  telemetry:
    logs:
      level: error
  pipelines:
    traces/full-input:
      receivers: [otlp]
      exporters: [otlphttp/pre-sampling, forward/tail]
    traces/retained:
      receivers: [forward/tail]
      processors: [tail_sampling, batch/retained]
      exporters: [otlphttp/retained]
