extensions:
  health_check:
    endpoint: ${env:PORTHOLE_COLLECTOR_HEALTH_LISTEN}
receivers:
  otlp:
    protocols:
      http:
        endpoint: ${env:PORTHOLE_COLLECTOR_LISTEN}
exporters:
  otlphttp/durable-sampling:
    traces_endpoint: ${env:PORTHOLE_COLLECTOR_DESTINATION}/api/porthole/v1/ingest/pre-sampling/traces
    headers:
      Authorization: ${env:PORTHOLE_COLLECTOR_AUTHORIZATION}
    encoding: json
    compression: none
    # No acknowledged memory queue, batch processor, or local tail decision.
    # Destination persists and derives metrics before its durable decision.
    sending_queue:
      enabled: false
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 2s
      max_elapsed_time: 8s
service:
  extensions: [health_check]
  telemetry:
    metrics:
      level: none
    logs:
      level: error
  pipelines:
    traces/full-input:
      receivers: [otlp]
      exporters: [otlphttp/durable-sampling]
